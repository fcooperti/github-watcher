name: Watch Upstream Zephyr PRs

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-new-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Python dependencies
        run: pip install pyyaml redmail

      - name: Find New PRs and Send Alerts
        env:
          EMAIL_API_KEY: ${{ secrets.ZEPHYR_UPSTREAM_EMAIL_API_KEY }}
          RECEIVER_EMAILS: ${{ secrets.ZEPHYR_UPSTREAM_RECEIVER_EMAILS }}
          FROM_EMAIL: ${{ secrets.ZEPHYR_UPSTREAM_FROM_EMAIL }}
          MAX_PRS_PER_RUN: ${{ vars.ZEPHYR_UPSTREAM_MAX_PRS_PER_RUN }}
          GITHUB_TOKEN: ${{ secrets.ZEPHYR_UPSTREAM_GITHUB_TOKEN }}
        run: bash scripts/check-prs.sh configs/zephyr-upstream-config.yml

      - name: Commit updated alerted PRs list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alerted/
          git diff --cached --quiet || git commit -m "Update alerted PRs list [zephyr-upstream]"
          git push
